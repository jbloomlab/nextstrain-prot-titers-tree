# Example of the `color_by_metadata_file` of `nextstrain-prot-titers-tree`, which holds
# additional entries for `color_by_metadata` in the same format used in the
# configuration file. It is intended for columns that are generated by a pipeline (here,
# one column per serum cohort) rather than written by hand.
#
# These entries are merged after those in the configuration file, and so are the last
# colorings offered in auspice.

frac_w_titer_below_140_All_sera:
  scale_type: viridis_linear
  title: fraction of all sera with titer < 140

frac_w_titer_below_140_EPIHK_sera:
  scale_type: viridis_linear
  title: fraction of EPIHK sera with titer < 140

frac_w_titer_below_140_NIID_sera:
  scale_type: viridis_linear
  title: fraction of NIID sera with titer < 140

frac_w_titer_below_140_SCH_sera:
  scale_type: viridis_linear
  title: fraction of SCH sera with titer < 140

frac_w_titer_below_140_UWMC_sera:
  scale_type: viridis_linear
  title: fraction of UWMC sera with titer < 140
  fixed_max: 1  # just an example of fixing upper limit to scale
