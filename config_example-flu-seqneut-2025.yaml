# Example configuration file for `nextstrain-prot-titers-tree`

# FASTA file with aligned protein sequences with titer measurements
alignment: data/example-flu-seqneut-2025/alignment.fa

# FASTA file with single outgroup sequence used to root tree, must already
# be aligned to rest of alignment. If you set outgroup to null then the
# tree is instead rooted by the dates using the least-squares method of treetime.
outgroup: data/example-flu-seqneut-2025/outgroup.fa

# Set branch lengths on the divergence tree to the number of amino-acid mutations
# rather than the maximum-likelihood lengths inferred by `treetime`. This key is
# optional and defaults to true.
set_branch_lengths_to_n_mutations: true

# Map sites in alignment to numbering used in mutation naming. Should be a TSV
# with three columns:
#  - sequential_site: sequential 1, 2, ... numbering of alignment
#  - protein: name of the protein (eg, HA1, HA2)
#  - protein_site: number of mutation in protein
site_numbering_map: data/example-flu-seqneut-2025/site_numbering_map.tsv

# TSV file with metadata on strains in alignment (not outgroup).
# Must have column "strain" matching the sequence names in alignment,
# and a column "date" with the numerical date (eg, 2025.5) or a YYYY[-MM-DD]
# format date (the MM and DD are optional).
# The strain cannot contain whitespace.
# Must also have the additional columns specified in `color_by_metadata`.
metadata: data/example-flu-seqneut-2025/metadata.tsv

# Columns in `metadata` that we include in the tree to enable it to
# be colored by them (do not include 'strain' or 'date'). Each key
# is a column name, and it defines a mapping that can optionally
# include any of the following keys:
#   - scale_type: "viridis_linear", "viridis_log", "viridis_r_linear", "viridis_r_log"
#   - fixed_min: number giving fixed minimum of scale; else determined from data
#   - fixed_max: number giving fixed maximum of scale; else determined from data
#   - exclude_auto_scale: list strains to exclude when calculating auto limits
#   - title: label for the coloring in auspice; else the column name is used
color_by_metadata:
  subclade: {}
  median_titer_All_sera:
    scale_type: viridis_r_log
    title: median titer (all sera)
  median_titer_EPIHK_sera:
    scale_type: viridis_r_log
    title: median titer (EPIHK cohort)
  median_titer_NIID_sera:
    scale_type: viridis_r_log
    title: median titer (NIID cohort)
  median_titer_SCH_sera:
    scale_type: viridis_r_log
    title: median titer (SCH cohort)
  median_titer_UWMC_sera:
    scale_type: viridis_r_log
    title: median titer (UWMC cohort)
    exclude_auto_scale: [A/Maldives/2147/2024]  # just an example of setting lims excluding extreme strain

# Additional entries for `color_by_metadata` read from this YAML file, which uses the
# same format, and are merged after the entries above. This key is optional and can be
# set to null if there is no such file. It is intended for columns generated by a
# pipeline rather than written by hand; a column cannot be in both places.
color_by_metadata_file: data/example-flu-seqneut-2025/color_by_metadata.yaml

# Metadata columns shown via node tooltips not already in `color_by_metadata`
metadata_columns:
  - strain_type

# Do we display per-serum titers in measurement panel? If no, set titers to null. If
# yes, specify a dict similar to below for a single collection of measurements, or a list
# of such dicts to make several collections that are selected among in the panel (see
# `config_example-flu-seqneut-2025-multi-collection.yaml`).
titers:
  titers_tsv: data/example-flu-seqneut-2025/titers.tsv  # TSV with titers, must have columns "strain" and "serum"
  titer_col: log2_titer  # column in titers_tsv with the titers
  grouping_columns:  # columns in titers_tsv by which titers can be grouped
    - serum
    - group
    - collection_date_numerical
    - age_years
    - sex
  addtl_args:  # additional arguments that can be passed to `augur measurements export`
    title: serum neutralizing titers  # title for measurements panel
    x-axis-label: log2 titer  # x-axis label
    measurements-display: raw

# display defaults for auspice configuration, or set to {} if you do
# not want to set any defaults. See:
# https://docs.nextstrain.org/projects/auspice/en/v2.47.0/advanced-functionality/view-settings.html
display_defaults:
  color_by: median_titer_All_sera
  distance_measure: div
  branch_label: aa

# results generated by pipeline go in this directory
results_subdir: results/example-flu-seqneut-2025

# Final auspice JSON goes here. Note that if you want to be able to look at the tree via
# a Nextstrain Community Build, you should following the naming convention described here:
# https://docs.nextstrain.org/en/latest/guides/share/community-builds.html
auspice_json: auspice/nextstrain-prot-titers-tree_example-flu-seqneut-2025.json

# additional arguments to augur export v2; all of these are optional, set to empty dict
# of {} of no additional arguments
addtl_export_args:
  title: Example tree for nextstrain-prot-titers-tree showing human neutralizing antibody titers to H3N2 influenza viruses as of summer of 2025
  maintainers: Jesse Bloom <https://jbloomlab.org/>
  build-url: https://github.com/jbloomlab/nextstrain-prot-titers-tree
